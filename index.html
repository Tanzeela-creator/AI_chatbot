<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        #chat {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .user {
            background: #e3f2fd;
            text-align: right;
        }

        .bot {
            background: #f1f1f1;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #333;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Chatbot</h1>

    <div id="chat"></div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    chat.innerHTML += `
        <div class="message user">
            <strong>You:</strong> ${message}
        </div>
    `;

    input.value = "";

    chat.innerHTML += `
        <div class="message bot" id="loading">
            <strong>Chatbot:</strong> Thinking...
        </div>
    `;

    try {

        const response = await fetch("/api", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        document.getElementById("loading").remove();

        if (data.reply) {

            chat.innerHTML += `
                <div class="message bot">
                    <strong>Chatbot:</strong> ${data.reply}
                </div>
            `;

        } else {

            chat.innerHTML += `
                <div class="message bot">
                    <strong>Error:</strong> ${data.error}
                </div>
            `;
        }

    } catch (error) {

        document.getElementById("loading").remove();

        chat.innerHTML += `
            <div class="message bot">
                <strong>Error:</strong> Something went wrong.
            </div>
        `;
    }

    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("message").addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
