<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Chatbot</title>

    <!-- Markdown + Security Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f3f4f6;

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .chat-container {

            width: 95%;

            max-width: 750px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);

            overflow: hidden;

        }

        .header {

            background: #333;

            color: white;

            padding: 20px;

            text-align: center;

        }

        .header-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

        }

        .header h1 {

            margin: 0;

            font-size: 25px;

        }

        .header p {

            margin: 7px 0 0;

            font-size: 14px;

            opacity: 0.8;

        }

        #clear-button {

            background: white;

            color: #333;

            padding: 8px 12px;

            font-size: 13px;

        }

        #clear-button:hover {

            background: #eeeeee;

        }

        #chat-box {

            height: 450px;

            overflow-y: auto;

            padding: 20px;

            background: #fafafa;

        }

        .welcome {

            text-align: center;

            color: #777;

            margin-top: 150px;

        }

        .welcome h3 {

            margin-bottom: 8px;

        }

        .user-message,
        .bot-message {

            margin: 12px 0;

            display: flex;

        }

        .user-message {

            justify-content: flex-end;

        }

        .bot-message {

            justify-content: flex-start;

        }

        .message {

            padding: 12px 15px;

            border-radius: 12px;

            max-width: 80%;

            line-height: 1.5;

            word-wrap: break-word;

        }

        .user-message .message {

            background: #333;

            color: white;

            border-bottom-right-radius: 3px;

        }

        .bot-message .message {

            background: #e5e7eb;

            color: #222;

            border-bottom-left-radius: 3px;

        }

        /* Markdown styling */

        .bot-message .message h1,
        .bot-message .message h2,
        .bot-message .message h3 {

            margin-top: 8px;

            margin-bottom: 8px;

        }

        .bot-message .message p {

            margin: 8px 0;

        }

        .bot-message .message ul,
        .bot-message .message ol {

            margin: 8px 0;

            padding-left: 25px;

        }

        .bot-message .message li {

            margin: 4px 0;

        }

        .bot-message .message code {

            background: #d1d5db;

            padding: 2px 5px;

            border-radius: 4px;

            font-family: monospace;

        }

        .bot-message .message pre {

            background: #d1d5db;

            padding: 10px;

            border-radius: 8px;

            overflow-x: auto;

        }

        .bot-message .message pre code {

            background: transparent;

            padding: 0;

        }

        /* Voice output button */

        .voice-output-button {

            margin-top: 8px;

            padding: 6px 10px;

            background: white;

            color: #333;

            border: 1px solid #ccc;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;

        }

        .voice-output-button:hover {

            background: #eeeeee;

        }

        .voice-output-button.speaking {

            background: #333;

            color: white;

        }

        .error-message {

            background: #fee2e2 !important;

            color: #991b1b !important;

        }

        .loading-message {

            opacity: 0.7;

        }

        .input-section {

            padding: 15px;

            border-top: 1px solid #ddd;

            background: white;

        }

        .input-area {

            display: flex;

            gap: 8px;

        }

        #message-input {

            flex: 1;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }

        #message-input:focus {

            border-color: #555;

        }

        button {

            padding: 13px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

        }

        #voice-button {

            background: #eeeeee;

            color: #333;

        }

        #voice-button:hover {

            background: #dddddd;

        }

        #voice-button.listening {

            background: #333;

            color: white;

        }

        #send-button {

            background: #333;

            color: white;

        }

        #send-button:hover {

            background: #555;

        }

        #send-button:disabled,
        #voice-button:disabled {

            background: #999;

            cursor: not-allowed;

        }

        .status {

            text-align: center;

            font-size: 12px;

            color: #777;

            margin-top: 8px;

        }

        @media (max-width: 600px) {

            body {

                align-items: flex-start;

                padding-top: 20px;

            }

            .chat-container {

                width: 95%;

            }

            #chat-box {

                height: 500px;

            }

            .message {

                max-width: 90%;

            }

            .header-top {

                flex-direction: column;

            }

            .input-area {

                flex-wrap: wrap;

            }

            #message-input {

                width: 100%;

                flex-basis: 100%;

            }

            #voice-button,
            #send-button {

                flex: 1;

            }

        }

    </style>

</head>

<body>

    <div class="chat-container">

        <div class="header">

            <div class="header-top">

                <h1>🤖 AI Chatbot</h1>

                <button id="clear-button">
                    Clear Chat
                </button>

            </div>

            <p>
                Your friendly AI assistant
            </p>

        </div>

        <div id="chat-box">

            <div class="welcome">

                <h3>
                    Welcome! 👋
                </h3>

                <p>
                    Type or speak your message to get started.
                </p>

            </div>

        </div>

        <div class="input-section">

            <div class="input-area">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button
                    id="voice-button"
                    title="Voice input"
                >
                    🎤
                </button>

                <button id="send-button">
                    Send
                </button>

            </div>

            <div
                class="status"
                id="status"
            >
                Press Enter to send
            </div>

        </div>

    </div>

    <script>

        const input =
            document.getElementById(
                "message-input"
            );

        const sendButton =
            document.getElementById(
                "send-button"
            );

        const voiceButton =
            document.getElementById(
                "voice-button"
            );

        const clearButton =
            document.getElementById(
                "clear-button"
            );

        const chatBox =
            document.getElementById(
                "chat-box"
            );

        const status =
            document.getElementById(
                "status"
            );

        // Store conversation history
        let conversationHistory = [];


        /*
         * Add a message to the chat.
         *
         * AI responses are rendered as Markdown.
         * User messages remain plain text.
         *
         * AI responses also get a Listen button.
         */

        function addMessage(
            sender,
            message,
            type
        ) {

            const messageContainer =
                document.createElement("div");

            messageContainer.className =
                type;

            const messageElement =
                document.createElement("div");

            messageElement.className =
                "message";

            const senderElement =
                document.createElement("strong");

            senderElement.textContent =
                sender + ": ";

            const textElement =
                document.createElement("div");


            /*
             * Render Markdown only for AI responses.
             *
             * marked.parse() converts Markdown into HTML.
             * DOMPurify.sanitize() removes unsafe HTML.
             */

            if (type === "bot-message") {

                textElement.innerHTML =
                    DOMPurify.sanitize(
                        marked.parse(message)
                    );

            }

            else {

                textElement.textContent =
                    message;

            }


            messageElement.appendChild(
                senderElement
            );

            messageElement.appendChild(
                textElement
            );


            /*
             * Add optional voice output button
             * only to AI messages.
             */

            if (type === "bot-message") {

                const voiceOutputButton =
                    document.createElement(
                        "button"
                    );

                voiceOutputButton.className =
                    "voice-output-button";

                voiceOutputButton.textContent =
                    "🔊 Listen";

                voiceOutputButton.title =
                    "Listen to this AI response";


                voiceOutputButton.addEventListener(
                    "click",
                    function() {

                        /*
                         * If speech is already running,
                         * stop it.
                         */

                        if (
                            "speechSynthesis" in window &&
                            window.speechSynthesis.speaking
                        ) {

                            window.speechSynthesis.cancel();

                            voiceOutputButton.textContent =
                                "🔊 Listen";

                            voiceOutputButton.classList.remove(
                                "speaking"
                            );

                            return;

                        }


                        /*
                         * Speak this specific AI response.
                         */

                        speakText(
                            message,
                            voiceOutputButton
                        );

                    }
                );


                messageElement.appendChild(
                    voiceOutputButton
                );

            }


            messageContainer.appendChild(
                messageElement
            );

            chatBox.appendChild(
                messageContainer
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /*
         * Display an error message.
         */

        function addErrorMessage(message) {

            const container =
                document.createElement("div");

            container.className =
                "bot-message";

            const messageElement =
                document.createElement("div");

            messageElement.className =
                "message error-message";

            const sender =
                document.createElement("strong");

            sender.textContent =
                "Error: ";

            const text =
                document.createElement("span");

            text.textContent =
                message;

            messageElement.appendChild(
                sender
            );

            messageElement.appendChild(
                text
            );

            container.appendChild(
                messageElement
            );

            chatBox.appendChild(
                container
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /*
         * Remove the welcome message
         * after the first user message.
         */

        function removeWelcomeMessage() {

            const welcome =
                document.querySelector(
                    ".welcome"
                );

            if (welcome) {

                welcome.remove();

            }

        }


        /*
         * Show loading message.
         */

        function showLoading() {

            const loadingContainer =
                document.createElement(
                    "div"
                );

            loadingContainer.className =
                "bot-message";

            loadingContainer.id =
                "loading";

            const messageElement =
                document.createElement(
                    "div"
                );

            messageElement.className =
                "message loading-message";

            messageElement.textContent =
                "Chatbot: Thinking...";

            loadingContainer.appendChild(
                messageElement
            );

            chatBox.appendChild(
                loadingContainer
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }


        /*
         * Remove loading message.
         */

        function removeLoading() {

            const loading =
                document.getElementById(
                    "loading"
                );

            if (loading) {

                loading.remove();

            }

        }


        /*
         * Voice Output / Text-to-Speech
         *
         * The AI response is NOT spoken automatically.
         *
         * It is spoken only when the user
         * clicks the "Listen" button.
         */

        function speakText(
            text,
            button
        ) {

            if (
                !("speechSynthesis" in window)
            ) {

                status.textContent =
                    "Voice output is not supported by this browser.";

                return;

            }


            // Stop any previous speech
            window.speechSynthesis.cancel();


            const speech =
                new SpeechSynthesisUtterance(
                    text
                );


            speech.lang =
                "en-US";

            speech.rate =
                1;

            speech.pitch =
                1;

            speech.volume =
                1;


            // Change button to Stop
            button.textContent =
                "⏹️ Stop";

            button.classList.add(
                "speaking"
            );


            /*
             * When speech finishes,
             * restore the Listen button.
             */

            speech.onend =
                function() {

                    button.textContent =
                        "🔊 Listen";

                    button.classList.remove(
                        "speaking"
                    );

                };


            /*
             * Handle speech errors.
             */

            speech.onerror =
                function() {

                    button.textContent =
                        "🔊 Listen";

                    button.classList.remove(
                        "speaking"
                    );

                };


            // Start speaking
            window.speechSynthesis.speak(
                speech
            );

        }


        /*
         * Send user message to the backend.
         */

        async function sendMessage() {

            const message =
                input.value.trim();


            // Input validation
            if (!message) {

                status.textContent =
                    "Please enter a message.";

                input.focus();

                return;

            }


            removeWelcomeMessage();


            // Add user message to history
            conversationHistory.push({

                role: "user",

                content: message

            });


            // Display user message
            addMessage(
                "You",
                message,
                "user-message"
            );


            input.value = "";


            // Disable controls
            sendButton.disabled =
                true;

            voiceButton.disabled =
                true;

            input.disabled =
                true;


            status.textContent =
                "AI is thinking...";


            showLoading();


            try {

                const response =
                    await fetch(
                        "/api",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                messages:
                                    conversationHistory

                            })

                        }
                    );


                let data;


                try {

                    data =
                        await response.json();

                }

                catch (jsonError) {

                    throw new Error(
                        "Invalid response received from server."
                    );

                }


                removeLoading();


                // Handle API errors
                if (!response.ok) {

                    // Remove failed user message
                    conversationHistory.pop();


                    addErrorMessage(
                        data.error ||
                        "The server returned an error."
                    );

                    return;

                }


                if (data.response) {


                    // Add AI response to history
                    conversationHistory.push({

                        role: "assistant",

                        content:
                            data.response

                    });


                    // Display AI response
                    addMessage(
                        "Chatbot",
                        data.response,
                        "bot-message"
                    );


                    /*
                     * IMPORTANT:
                     *
                     * No automatic voice output here.
                     *
                     * The user must click
                     * the "🔊 Listen" button.
                     */

                }

                else {

                    conversationHistory.pop();

                    addErrorMessage(
                        "No response received from the AI."
                    );

                }

            }


            catch (error) {

                removeLoading();


                console.error(
                    "Chatbot error:",
                    error
                );


                // Remove failed message
                conversationHistory.pop();


                addErrorMessage(
                    "Unable to connect to the AI service. Please try again."
                );

            }


            finally {

                sendButton.disabled =
                    false;

                voiceButton.disabled =
                    false;

                input.disabled =
                    false;

                status.textContent =
                    "Press Enter to send";

                input.focus();

            }

        }


        /*
         * Clear conversation.
         */

        function clearChat() {


            /*
             * Stop any current voice output.
             */

            if (
                "speechSynthesis" in window
            ) {

                window.speechSynthesis.cancel();

            }


            conversationHistory = [];


            chatBox.innerHTML = `

                <div class="welcome">

                    <h3>
                        Welcome! 👋
                    </h3>

                    <p>
                        Type or speak your message to get started.
                    </p>

                </div>

            `;


            status.textContent =
                "Chat cleared.";


            input.focus();

        }


        /*
         * Voice Input
         *
         * Uses the browser's Speech Recognition API.
         */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition =
            null;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-US";


            /*
             * Voice input starts.
             */

            recognition.onstart =
                function() {

                    voiceButton.classList.add(
                        "listening"
                    );

                    status.textContent =
                        "Listening... Speak now.";

                };


            /*
             * Voice input result.
             */

            recognition.onresult =
                function(event) {

                    const transcript =
                        event.results[0][0]
                            .transcript;


                    input.value =
                        transcript;


                    status.textContent =
                        "Voice input received.";

                };


            /*
             * Voice input error.
             */

            recognition.onerror =
                function(event) {

                    console.error(
                        "Voice error:",
                        event.error
                    );


                    status.textContent =
                        "Voice input failed. Please try again.";

                };


            /*
             * Voice input ends.
             */

            recognition.onend =
                function() {

                    voiceButton.classList.remove(
                        "listening"
                    );

                };

        }


        else {

            voiceButton.disabled =
                true;

            status.textContent =
                "Voice input is not supported by this browser.";

        }


        /*
         * Start voice input when
         * microphone button is clicked.
         */

        voiceButton.addEventListener(
            "click",
            function() {

                if (!recognition) {

                    return;

                }


                try {

                    recognition.start();

                }

                catch (error) {

                    console.error(
                        "Voice start error:",
                        error
                    );

                }

            }
        );


        /*
         * Send button.
         */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        /*
         * Clear button.
         */

        clearButton.addEventListener(
            "click",
            clearChat
        );


        /*
         * Press Enter to send.
         */

        input.addEventListener(
            "keypress",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
