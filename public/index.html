<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 5px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }

        #chat-box {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .welcome {
            text-align: center;
            color: #777;
            margin-top: 170px;
        }

        .user-message,
        .bot-message {
            margin: 12px 0;
            display: flex;
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message {
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message .message {
            background: #333;
            color: white;
            border-bottom-right-radius: 3px;
        }

        .bot-message .message {
            background: #e5e7eb;
            color: #222;
            border-bottom-left-radius: 3px;
        }

        .error-message {
            background: #fee2e2 !important;
            color: #991b1b !important;
        }

        .input-section {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #message-input:focus {
            border-color: #555;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        #send-button {
            background: #333;
            color: white;
        }

        #send-button:hover {
            background: #555;
        }

        #send-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }

        @media (max-width: 600px) {

            body {
                align-items: flex-start;
                padding-top: 20px;
            }

            .chat-container {
                width: 95%;
            }

            #chat-box {
                height: 500px;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                gap: 6px;
            }

            #send-button {
                padding: 12px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>🤖 AI Chatbot</h1>
            <p>Your friendly AI assistant</p>
        </div>

        <div id="chat-box">

            <div class="welcome">
                <h3>Welcome! 👋</h3>
                <p>Ask me anything to get started.</p>
            </div>

        </div>

        <div class="input-section">

            <div class="input-area">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button id="send-button">
                    Send
                </button>

            </div>

            <div class="status" id="status">
                Press Enter to send
            </div>

        </div>

    </div>

    <script>

        const input = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const chatBox = document.getElementById("chat-box");
        const status = document.getElementById("status");

        function addMessage(sender, message, type) {

            const messageContainer = document.createElement("div");
            messageContainer.className = type;

            const messageElement = document.createElement("div");
            messageElement.className = "message";

            const senderElement = document.createElement("strong");
            senderElement.textContent = sender + ": ";

            const textElement = document.createElement("span");
            textElement.textContent = message;

            messageElement.appendChild(senderElement);
            messageElement.appendChild(textElement);

            messageContainer.appendChild(messageElement);
            chatBox.appendChild(messageContainer);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function removeWelcomeMessage() {

            const welcome = document.querySelector(".welcome");

            if (welcome) {
                welcome.remove();
            }
        }


        async function sendMessage() {

            const message = input.value.trim();

            // Input validation
            if (!message) {

                status.textContent = "Please enter a message.";

                input.focus();

                return;
            }

            removeWelcomeMessage();

            // Disable button while waiting
            sendButton.disabled = true;
            input.disabled = true;

            status.textContent = "AI is thinking...";

            // Display user message
            addMessage("You", message, "user-message");

            input.value = "";

            // Create loading message
            const loadingContainer = document.createElement("div");

            loadingContainer.className = "bot-message";
            loadingContainer.id = "loading";

            loadingContainer.innerHTML = `
                <div class="message">
                    <strong>Chatbot: </strong>
                    Thinking...
                </div>
            `;

            chatBox.appendChild(loadingContainer);

            chatBox.scrollTop = chatBox.scrollHeight;


            try {

                const response = await fetch("/api", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                let data;

                try {
                    data = await response.json();
                }

                catch (jsonError) {

                    throw new Error(
                        "Invalid response received from server."
                    );

                }


                // Remove loading message
                const loading = document.getElementById("loading");

                if (loading) {
                    loading.remove();
                }


                // Handle API errors
                if (!response.ok) {

                    addErrorMessage(
                        data.error || "The server returned an error."
                    );

                    return;
                }


                // Handle successful response
                if (data.response) {

                    addMessage(
                        "Chatbot",
                        data.response,
                        "bot-message"
                    );

                }

                else {

                    addErrorMessage(
                        "No response received from the AI."
                    );

                }

            }

            catch (error) {

                const loading = document.getElementById("loading");

                if (loading) {
                    loading.remove();
                }

                console.error("Chatbot error:", error);

                addErrorMessage(
                    "Unable to connect to the AI service. Please try again."
                );

            }

            finally {

                // Re-enable input
                sendButton.disabled = false;
                input.disabled = false;

                status.textContent = "Press Enter to send";

                input.focus();

            }

        }


        function addErrorMessage(message) {

            const container = document.createElement("div");

            container.className = "bot-message";

            const messageElement = document.createElement("div");

            messageElement.className = "message error-message";

            const sender = document.createElement("strong");

            sender.textContent = "Error: ";

            const text = document.createElement("span");

            text.textContent = message;

            messageElement.appendChild(sender);
            messageElement.appendChild(text);

            container.appendChild(messageElement);

            chatBox.appendChild(container);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        // Send button
        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // Enter key
        input.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
