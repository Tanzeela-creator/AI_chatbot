    <style>

        * {

        body {

            font-family: Arial, sans-serif;

</head>

<body>

    <div class="chat-container">

        <div class="header">

            <div class="header-top">

                <h1>🤖 AI Chatbot</h1>

                <button id="clear-button">
                    Clear Chat
                </button>

            </div>

            <p>
                Your friendly AI assistant
            </p>

        </div>

        <div id="chat-box">

            <div class="welcome">

                <h3>
                    Welcome! 👋
                </h3>

                <p>
                    Type or speak your message to get started.
                </p>

            </div>

        </div>

        <div class="input-section">

            <div class="input-area">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button
                    id="voice-button"
                    title="Voice input"
                >
                    🎤
                </button>

                <button id="send-button">
                    Send
                </button>

            </div>

            <div
                class="status"
                id="status"
            >
                Press Enter to send
            </div>

        </div>

    </div>

    <script>

        const input =
            document.getElementById(
                "message-input"
            );

        const sendButton =
            document.getElementById(
                "send-button"
            );

        const voiceButton =
            document.getElementById(
                "voice-button"
            );

        const clearButton =
            document.getElementById(
                "clear-button"
            );

        const chatBox =
            document.getElementById(
                "chat-box"
            );

        const status =
            document.getElementById(
                "status"
            );

        // Store conversation history
        let conversationHistory = [];

        function addMessage(
            sender,
            message,
            type
        ) {

            const messageContainer =
                document.createElement("div");

            messageContainer.className =
                type;

            const messageElement =
                document.createElement("div");

            messageElement.className =
                "message";

            const senderElement =
                document.createElement("strong");

            senderElement.textContent =
                sender + ": ";

            const textElement =
                document.createElement("div");

            /*
             * Render Markdown only for AI responses.
             *
             * marked.parse() converts Markdown into HTML.
             * DOMPurify.sanitize() removes unsafe HTML.
             *
             * User messages remain plain text for security.
             */

            if (type === "bot-message") {

                textElement.innerHTML =
                    DOMPurify.sanitize(
                        marked.parse(message)
                    );

            }

            else {

                textElement.textContent =
                    message;

            }

            messageElement.appendChild(
                senderElement
            );

            messageElement.appendChild(
                textElement
            );

            messageContainer.appendChild(
                messageElement
            );

            chatBox.appendChild(
                messageContainer
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }

        function addErrorMessage(message) {

            const container =
                document.createElement("div");

            container.className =
                "bot-message";

            const messageElement =
                document.createElement("div");

            messageElement.className =
                "message error-message";

            const sender =
                document.createElement("strong");

            sender.textContent =
                "Error: ";

            const text =
                document.createElement("span");

            text.textContent =
                message;

            messageElement.appendChild(
                sender
            );

            messageElement.appendChild(
                text
            );

            container.appendChild(
                messageElement
            );

            chatBox.appendChild(
                container
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }

        function removeWelcomeMessage() {

            const welcome =
                document.querySelector(
                    ".welcome"
                );

            if (welcome) {

                welcome.remove();

            }

        }

        function showLoading() {

            const loadingContainer =
                document.createElement(
                    "div"
                );

            loadingContainer.className =
                "bot-message";

            loadingContainer.id =
                "loading";

            const messageElement =
                document.createElement(
                    "div"
                );

            messageElement.className =
                "message loading-message";

            messageElement.textContent =
                "Chatbot: Thinking...";

            loadingContainer.appendChild(
                messageElement
            );

            chatBox.appendChild(
                loadingContainer
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;

        }

        function removeLoading() {

            const loading =
                document.getElementById(
                    "loading"
                );

            if (loading) {

                loading.remove();

            }

        }

        /*
         * Voice Output / Text-to-Speech
         *
         * Converts the AI's text response into speech
         * using the browser's built-in Speech Synthesis API.
         */

        function speakText(text) {

            if ("speechSynthesis" in window) {

                // Stop any previous speech
                window.speechSynthesis.cancel();

                const speech =
                    new SpeechSynthesisUtterance(text);

                speech.lang = "en-US";
                speech.rate = 1;
                speech.pitch = 1;
                speech.volume = 1;

                window.speechSynthesis.speak(
                    speech
                );

            }

        }

        async function sendMessage() {

            const message =
                input.value.trim();

            // Input validation
            if (!message) {

                status.textContent =
                    "Please enter a message.";

                input.focus();

                return;

            }

            removeWelcomeMessage();

            // Add user message to history
            conversationHistory.push({

                role: "user",

                content: message

            });

            // Display user message
            addMessage(
                "You",
                message,
                "user-message"
            );

            input.value = "";

            // Disable controls
            sendButton.disabled = true;

            voiceButton.disabled = true;

            input.disabled = true;

            status.textContent =
                "AI is thinking...";

            showLoading();

            try {

                const response =
                    await fetch(
                        "/api",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                messages:
                                    conversationHistory

                            })

                        }
                    );

                let data;

                try {

                    data =
                        await response.json();

                }

                catch (jsonError) {

                    throw new Error(
                        "Invalid response received from server."
                    );

                }

                removeLoading();

                // Handle API errors
                if (!response.ok) {

                    // Remove failed user message
                    conversationHistory.pop();

                    addErrorMessage(
                        data.error ||
                        "The server returned an error."
                    );

                    return;

                }

                if (data.response) {

                    // Add AI response to history
                    conversationHistory.push({

                        role: "assistant",

                        content: data.response

                    });

                    // Display AI response
                    addMessage(
                        "Chatbot",
                        data.response,
                        "bot-message"
                    );

                    // Speak the AI response aloud
                    speakText(data.response);

                }

                else {

                    conversationHistory.pop();

                    addErrorMessage(
                        "No response received from the AI."
                    );

                }

            }

            catch (error) {

                removeLoading();

                console.error(
                    "Chatbot error:",
                    error
                );

                // Remove failed message
                conversationHistory.pop();

                addErrorMessage(
                    "Unable to connect to the AI service. Please try again."
                );

            }

            finally {

                sendButton.disabled =
                    false;

                voiceButton.disabled =
                    false;

                input.disabled =
                    false;

                status.textContent =
                    "Press Enter to send";

                input.focus();

            }

        }

        // Clear conversation
        function clearChat() {

            // Stop current voice output
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }

            conversationHistory = [];

            chatBox.innerHTML = `

                <div class="welcome">

                    <h3>
                        Welcome! 👋
                    </h3>

                    <p>
                        Type or speak your message to get started.
                    </p>

                </div>

            `;

            status.textContent =
                "Chat cleared.";

            input.focus();

        }

        // Voice input
        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();

            recognition.continuous =
                false;

            recognition.interimResults =
                false;

            recognition.lang =
                "en-US";

            recognition.onstart =
                function() {

                    voiceButton.classList.add(
                        "listening"
                    );

                    status.textContent =
                        "Listening... Speak now.";

                };

            recognition.onresult =
                function(event) {

                    const transcript =
                        event.results[0][0]
                            .transcript;

                    input.value =
                        transcript;

                    status.textContent =
                        "Voice input received.";

                };

            recognition.onerror =
                function(event) {

                    console.error(
                        "Voice error:",
                        event.error
                    );

                    status.textContent =
                        "Voice input failed. Please try again.";

                };

            recognition.onend =
                function() {

                    voiceButton.classList.remove(
                        "listening"
                    );

                };

        }

        else {

            voiceButton.disabled =
                true;

            status.textContent =
                "Voice input is not supported by this browser.";

        }

        voiceButton.addEventListener(
            "click",
            function() {

                if (!recognition) {

                    return;

                }

                try {

                    recognition.start();

                }

                catch (error) {

                    console.error(
                        "Voice start error:",
                        error
                    );

                }

            }
        );

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        clearButton.addEventListener(
            "click",
            clearChat
        );

        input.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );

    </script>

</body>

</html>
